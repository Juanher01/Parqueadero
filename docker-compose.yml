services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parqueadero
      POSTGRES_PASSWORD: parqueadero
      POSTGRES_DB: parqueadero
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parqueadero"]
      interval: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parqueadero:parqueadero@db:5432/parqueadero
      CORS_ORIGINS: http://localhost:5173
      YOLO_MODEL_PATH: /app/models/yolo/best.pt
      OCR_MODEL_PATH: /app/models/ocr/modelo_ocr_exportado
    volumes:
      - ./backend/models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
